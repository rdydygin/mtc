[package]
name = "mtc"
description = "A fast, keyboard-first Mattermost desktop client built with GPUI Kit"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mtc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
futures.workspace = true
getrandom = "0.3"
gpui-kit = { workspace = true, default-features = true, features = ["syntect"] }
log.workspace = true
mattermost.workspace = true
reqwest.workspace = true
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
session.workspace = true
sha2 = "0.10"
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
gpui-kit = { workspace = true, default-features = true, features = ["test-support"] }
mattermost = { workspace = true, features = ["test-support"] }
