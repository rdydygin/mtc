[package]
name = "mtc"
description = "A fast, keyboard-first Mattermost desktop client built with GPUI Kit"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mtc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
futures.workspace = true
getrandom = "0.3"
hmac = "0.12"
# The same crate GPUI decodes images with: its format check, and PNG for SVG helpers.
image = { version = "0.25", default-features = false, features = ["png"] }
gpui-kit = { workspace = true, default-features = true, features = ["syntect"] }
log.workspace = true
mattermost.workspace = true
reqwest.workspace = true
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
session.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["process", "io-util"] }
url.workspace = true
# What usvg, GPUI's SVG renderer, parses with; the same versions.
data-url = "0.3"
imagesize = "0.14"
roxmltree = "0.21"
simplecss = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
gpui-kit = { workspace = true, default-features = true, features = ["test-support"] }
mattermost = { workspace = true, features = ["test-support"] }
# Renders test SVGs as GPUI does, to check the image guard against it.
usvg = "0.46"
