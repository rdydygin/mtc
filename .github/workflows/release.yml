name: Release

# Publish a release in either of two ways:
#   - Actions → Release → Run workflow: tags the chosen branch as v<version> (the
#     workspace version in Cargo.toml) and publishes it.
#   - Push a tag matching the workspace version: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Build mtc.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="mtc"))')
          TAG="v${VERSION}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo version ${TAG}"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Bump version in Cargo.toml first."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --workspace --locked

      - name: Bundle
        run: script/bundle-macos --universal

      - name: Package
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          lipo -info target/release/bundle/mtc.app/Contents/MacOS/mtc
          ZIP="mtc-${TAG}-macos-universal.zip"
          # ditto keeps the bundle's symlinks, permissions and signature intact.
          ditto -c -k --keepParent target/release/bundle/mtc.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Write the update feed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # Installed copies read releases/latest/download/latest.json to find
          # and verify updates (crates/app/src/update/manifest.rs).
          python3 - <<'PY'
          import json, os
          tag, zip_name, repo = os.environ["TAG"], os.environ["ZIP"], os.environ["GITHUB_REPOSITORY"]
          sha256 = open(zip_name + ".sha256").read().split()[0]
          feed = {
              "version": tag.removeprefix("v"),
              "page": f"https://github.com/{repo}/releases/tag/{tag}",
              "downloads": {
                  "macos-universal": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{zip_name}",
                      "sha256": sha256,
                  },
              },
          }
          with open("latest.json", "w") as f:
              json.dump(feed, f, indent=2)
          PY
          cat latest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # --target creates the tag at this commit when the run was started by hand;
          # for a pushed tag it already exists and is used as is.
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" latest.json \
            --target "$GITHUB_SHA" \
            --title "mtc $TAG" \
            --generate-notes \
            --notes "Runs on Apple Silicon and Intel Macs (macOS 12 or later). The app is ad-hoc signed, not notarized. After unzipping, move mtc.app to Applications, then run \`xattr -dr com.apple.quarantine /Applications/mtc.app\` or right-click → Open the first time. Later versions install themselves."
