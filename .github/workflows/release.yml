name: Release

# Merging to main does not release. Tags use their exact version; manual runs
# can choose a version or default to the next patch / higher workspace version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (MAJOR.MINOR.PATCH); empty = next patch or higher Cargo.toml version"
        required: false
        type: string
      dry_run:
        description: "Build and verify artifacts without creating a tag or release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build mtc.app
    needs: ci
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      zip: ${{ steps.package.outputs.zip }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the built commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Pick the release version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" != "$VERSION" ]]; then
              echo "::error::The version input must match the selected tag."
              exit 1
            fi
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            BASE=$(cargo metadata --locked --no-deps --format-version 1 \
              | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="mtc"))')
            # The checkout is shallow; list tags through the authenticated API.
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '.[].ref' > release-tags.txt
            VERSION=$(python3 - "$BASE" <<'PYVERSION'
          import re, sys
          def parse(v):
              m = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", v)
              return tuple(map(int, m.groups())) if m else None
          base = parse(sys.argv[1])
          assert base is not None, "workspace version must be MAJOR.MINOR.PATCH"
          tags = [parse(line.strip().removeprefix("refs/tags/v")) for line in open("release-tags.txt")]
          latest = max((t for t in tags if t), default=None)
          major, minor, patch = base if latest is None or latest < base else (latest[0], latest[1], latest[2] + 1)
          print(f"{major}.{minor}.{patch}")
          PYVERSION
          )
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::${VERSION} is not a release version (MAJOR.MINOR.PATCH)"
            exit 1
          fi
          TAG="v${VERSION}"
          # Include drafts and fail on API errors, rather than treating any
          # failed lookup as proof that a release does not exist.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > releases.txt
          if grep -Fxq "$TAG" releases.txt; then
            echo "::error::Release ${TAG} already exists (possibly a draft)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Stamp the version into this checkout only (nothing is committed), so the
      # binary's CARGO_PKG_VERSION and the bundle's Info.plist carry it.
      - name: Set the version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          MEMBERS=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(" ".join(p["name"] for p in json.load(sys.stdin)["packages"]))')
          python3 - $MEMBERS <<'PY'
          import os, re, sys
          version, members = os.environ["VERSION"], sys.argv[1:]
          toml = open("Cargo.toml").read()
          toml, n = re.subn(r'(\[workspace\.package\][^\[]*?\nversion = )"[^"]*"', rf'\1"{version}"', toml)
          assert n == 1, "no version in [workspace.package]"
          open("Cargo.toml", "w").write(toml)
          lock = open("Cargo.lock").read()
          for name in members:
              lock, n = re.subn(rf'(\nname = "{re.escape(name)}"\nversion = )"[^"]*"', rf'\1"{version}"', lock)
              assert n == 1, f"{name} not in Cargo.lock"
          open("Cargo.lock", "w").write(lock)
          PY
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          git diff

      - name: Bundle
        run: script/bundle-macos --universal

      - name: Package
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          lipo -info target/release/bundle/mtc.app/Contents/MacOS/mtc
          ZIP="mtc-${TAG}-macos-universal.zip"
          # ditto keeps the bundle's symlinks, permissions and signature intact.
          ditto -c -k --keepParent target/release/bundle/mtc.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Write the update feed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # Installed copies read releases/latest/download/latest.json to find
          # and verify updates (crates/app/src/update/manifest.rs).
          python3 - <<'PY'
          import json, os
          tag, zip_name, repo = os.environ["TAG"], os.environ["ZIP"], os.environ["GITHUB_REPOSITORY"]
          sha256 = open(zip_name + ".sha256").read().split()[0]
          feed = {
              "version": tag.removeprefix("v"),
              "page": f"https://github.com/{repo}/releases/tag/{tag}",
              "downloads": {
                  "macos-universal": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{zip_name}",
                      "sha256": sha256,
                  },
              },
          }
          with open("latest.json", "w") as f:
              json.dump(feed, f, indent=2)
          PY
          cat latest.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
            latest.json

  verify:
    name: Verify release artifacts
    needs: build
    runs-on: ubuntu-latest
    # Both real releases and dry runs verify the downloaded artifact, without
    # a write token or any repository checkout/code execution.
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
      - name: Verify archive, checksum, update feed and bundle version
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP: ${{ needs.build.outputs.zip }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, plistlib, re, zipfile
          from pathlib import Path

          version, tag, zip_name, repo = (os.environ[k] for k in ("VERSION", "TAG", "ZIP", "GITHUB_REPOSITORY"))
          assert tag == f"v{version}", "tag does not match the picked version"
          assert zip_name == f"mtc-{tag}-macos-universal.zip", "unexpected archive name"
          archive_path = Path(zip_name)
          assert archive_path.is_file() and archive_path.stat().st_size > 0, "archive missing or empty"
          checksum = Path(zip_name + ".sha256").read_text().split()
          assert len(checksum) == 2 and checksum[1] == zip_name, "checksum names the wrong archive"
          assert re.fullmatch(r"[0-9a-f]{64}", checksum[0]), "invalid SHA-256 checksum"
          digest = hashlib.sha256()
          with archive_path.open("rb") as archive_file:
              for chunk in iter(lambda: archive_file.read(1024 * 1024), b""):
                  digest.update(chunk)
          sha256 = digest.hexdigest()
          assert sha256 == checksum[0], "archive SHA-256 mismatch"

          page = f"https://github.com/{repo}/releases/tag/{tag}"
          url = f"https://github.com/{repo}/releases/download/{tag}/{zip_name}"
          feed = json.loads(Path("latest.json").read_text())
          assert feed["version"] == version, "feed version mismatch"
          assert feed["page"] == page, "feed release page mismatch"
          assert feed["downloads"]["macos-universal"] == {"url": url, "sha256": sha256}, "feed download URL or checksum mismatch"

          # Inspect directly in the archive; no macOS runner or extraction needed.
          with zipfile.ZipFile(archive_path) as archive:
              assert archive.testzip() is None, "corrupt zip member"
              assert archive.getinfo("mtc.app/Contents/MacOS/mtc").file_size > 0, "bundle executable is empty"
              plist = plistlib.loads(archive.read("mtc.app/Contents/Info.plist"))
          assert plist["CFBundleIdentifier"] == "dev.mtc.desktop", "bundle identifier mismatch"
          assert plist["CFBundleShortVersionString"] == version, "bundle version mismatch"
          assert plist["CFBundleVersion"] == version, "bundle build version mismatch"

          dry_run = os.environ["DRY_RUN"] == "true"
          heading = "Release dry run verified" if dry_run else "Release artifacts verified"
          summary = (
              f"## {heading}\n\n"
              f"- Version: `{version}` (`{tag}`)\n"
              f"- Built commit: `{os.environ['BUILT_SHA']}`\n"
              f"- Archive: `{zip_name}` ({archive_path.stat().st_size} bytes)\n"
              f"- SHA-256: `{sha256}`\n"
              f"- Update feed target: {url}\n"
              f"- Archive integrity, feed fields and bundle versions verified.\n"
          )
          if dry_run:
              summary += "\nPublication skipped: no tag, release or draft is created by this dry run.\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          PYVERIFY

  publish:
    name: Publish release
    needs: [build, verify]
    # Only manual runs may opt out; tag pushes always publish after verification.
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    # This is the only job allowed to mutate tags or releases. It never runs
    # repository code; it receives just the three packaged assets.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
      - name: Draft, upload, verify tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP: ${{ needs.build.outputs.zip }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
        run: |
          # Draft creation may defer tag creation until publication. Explicitly
          # create a missing tag for manual branch runs so it can be verified
          # before the release becomes visible. Never recreate a pushed tag.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::The selected tag no longer exists."
              exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$BUILT_SHA" > /dev/null
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --target "$BUILT_SHA" \
            --title "mtc $TAG" \
            --generate-notes \
            --notes "Runs on Apple Silicon and Intel Macs (macOS 12 or later). The app is ad-hoc signed, not notarized. After unzipping, move mtc.app to Applications, then run \`xattr -dr com.apple.quarantine /Applications/mtc.app\` or right-click → Open the first time. Later versions install themselves."
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256" latest.json --repo "$GITHUB_REPOSITORY"

          # Resolve lightweight AND annotated tags through to the commit, using
          # a fresh lookup after uploads to catch a moved tag during the build.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json
          TYPE=$(jq -r '.object.type' tag.json)
          SHA=$(jq -r '.object.sha' tag.json)
          while [[ "$TYPE" == "tag" ]]; do
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" > tag.json
            TYPE=$(jq -r '.object.type' tag.json)
            SHA=$(jq -r '.object.sha' tag.json)
          done
          if [[ "$TYPE" != "commit" || "$SHA" != "$BUILT_SHA" ]]; then
            echo "::error::Tag $TAG resolves to $TYPE $SHA; built $BUILT_SHA. Release left as draft."
            exit 1
          fi
          # Drafts are excluded from releases/latest, so the feed is visible
          # only once all assets are present and the source commit is verified.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
